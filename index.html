<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Super Orion 2 — Cosmic Cannonball</title>
<style>
  :root{
    --ink:#0b1020; --paper:#fff6e0; --gold:#ffd23f; --pop:#ff5d73; --cool:#4ec5f1;
    --ui: 800 clamp(14px,2.4vmin,26px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b1020;color:var(--paper);
    font:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud,#overlay,#touch{position:fixed;inset:0;pointer-events:none}

  /* ---------- HUD ---------- */
  #hud{padding:clamp(8px,2vmin,20px);display:flex;justify-content:space-between;align-items:flex-start;
       text-shadow:0 3px 0 rgba(0,0,0,.55);font-size:clamp(16px,3.2vmin,34px)}
  #hud .grp{display:flex;gap:.55em;align-items:center}
  #hearts{display:flex;gap:.55em;align-items:center}
  #hearts span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
  #hearts span.gone{opacity:.22;filter:grayscale(1)}
  /* Air (reef) / fuel (cosmic). Only shown in a mode that meters lift. */
  #tank{display:none;width:clamp(64px,13vmin,150px);height:.55em;border-radius:.3em;
        background:rgba(0,0,0,.42);box-shadow:0 0 0 .12em rgba(0,0,0,.45)}
  #tank.on{display:block}
  #tank i{display:block;height:100%;border-radius:.3em;background:var(--cool);
          transform-origin:left;transition:background .2s}
  #tank[data-kind="jet"] i{background:#ffb03a}
  #tank.low i{background:#ff5d73}
  /* The boss's three crowns. Centred at the top, because it belongs to the
     fight rather than to Orion's side of the HUD. */
  #boss{position:fixed;left:50%;top:clamp(8px,2vmin,20px);transform:translateX(-50%);
        display:none;gap:.4em;pointer-events:none;font-size:clamp(20px,4vmin,42px);
        text-shadow:0 3px 0 rgba(0,0,0,.55)}
  #boss.on{display:flex}
  #boss span.gone{opacity:.25;filter:grayscale(1)}
  /* The map has no hearts to lose and no lives to spend. */
  #hud.hub #hearts,#hud.hub #lives,#hud.hub #tank{display:none}
  #stars{color:var(--gold)}
  #lives{color:var(--cool)}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.8);opacity:0;
    font-size:clamp(20px,5vmin,52px);color:var(--gold);text-shadow:0 4px 0 rgba(0,0,0,.6);
    transition:transform .18s cubic-bezier(.2,1.8,.4,1),opacity .18s}
  #toast.on{transform:translateX(-50%) scale(1);opacity:1}
  #toast.tip{font-size:clamp(13px,2.3vmin,21px);color:#eaf1ff;max-width:min(600px,86vw);
    line-height:1.5;background:rgba(11,16,32,.62);padding:.7em 1.1em;border-radius:.7em}

  /* ---------- Overlays ---------- */
  #overlay{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#1a2450,#070a18 75%);
    text-align:center;padding:6vmin;transition:opacity .35s}
  #overlay.hide{opacity:0;pointer-events:none}
  #overlay .card{max-width:min(760px,92vw)}
  h1{font-size:clamp(34px,9vmin,96px);line-height:.95;letter-spacing:-.02em;
     background:linear-gradient(180deg,#fff,#ffd23f 55%,#ff9d2f);-webkit-background-clip:text;
     background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
  h1 small{display:block;font-size:.28em;letter-spacing:.28em;color:#9fb4ff;
     -webkit-text-fill-color:#9fb4ff;margin-top:.7em}
  p.lead{margin:1.4em 0;font-weight:600;font-size:clamp(14px,2.4vmin,22px);color:#c9d6ff;line-height:1.6}
  .keys{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin:1.2em 0 1.8em}
  kbd{background:#232e5c;border:2px solid #3d4d8f;border-bottom-width:5px;border-radius:.5em;
      padding:.35em .7em;font:inherit;font-size:clamp(11px,1.8vmin,16px);color:#dce6ff}
  .go{font-size:clamp(16px,3vmin,28px);color:var(--gold);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  /* Sits inside #overlay, so it's only clickable when an overlay is showing —
     never during play, where it would be a tap-target over the game. */
  #quit{pointer-events:auto;position:absolute;left:clamp(12px,3vmin,28px);top:clamp(12px,3vmin,28px);
    font-size:clamp(11px,1.9vmin,15px);letter-spacing:.12em;color:#9fb4ff;text-decoration:none;
    background:#232e5c;border:2px solid #3d4d8f;border-bottom-width:4px;border-radius:.6em;
    padding:.5em .9em;transition:border-color .15s,color .15s}
  #quit:hover,#quit:focus-visible{border-color:var(--gold);color:var(--paper);outline:none}
  #loadbar{width:min(340px,70vw);height:12px;border-radius:99px;background:#232e5c;margin:1.5em auto 0;overflow:hidden}
  #loadbar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;
    background:linear-gradient(90deg,#4ec5f1,#ffd23f);transition:transform .2s}

  /* ---------- Sound menu ----------
     #overlay is pointer-events:none so a card never swallows a tap meant for
     the touch buttons underneath it. Everything you can press opts back in. */
  .pill{pointer-events:auto;cursor:pointer;font:inherit;font-size:clamp(11px,1.9vmin,16px);
    background:#232e5c;border:2px solid #3d4d8f;border-bottom-width:5px;border-radius:.6em;
    padding:.45em .9em;color:#dce6ff;margin-left:.4em}
  .pill:hover,.pill:focus-visible{border-color:var(--gold);color:var(--paper);outline:none}
  .opts{display:grid;gap:.7em;margin:1.6em auto;max-width:min(560px,88vw)}
  .opt{display:flex;align-items:center;gap:.5em;padding:.5em .7em;border-radius:.7em;
    border:2px solid transparent;background:rgba(11,16,32,.45);pointer-events:auto}
  .opt.on{border-color:var(--gold);background:rgba(35,46,92,.75)}
  .opt .lbl{width:6.4em;text-align:left;font-size:clamp(12px,2.1vmin,19px)}
  .opt .pct{width:3em;text-align:right;color:var(--gold);font-size:clamp(12px,2.1vmin,19px)}
  .nudge{pointer-events:auto;cursor:pointer;flex:none;width:1.9em;height:1.9em;font:inherit;
    font-size:clamp(13px,2.2vmin,20px);border-radius:.45em;background:#232e5c;color:#dce6ff;
    border:2px solid #3d4d8f;border-bottom-width:4px}
  .nudge:active{border-bottom-width:2px;transform:translateY(2px)}
  .meter{pointer-events:auto;cursor:pointer;flex:1;height:1.15em;border-radius:.6em;
    touch-action:none;background:#141b3a;box-shadow:inset 0 0 0 2px #3d4d8f;overflow:hidden}
  .meter i{display:block;height:100%;transform-origin:left;
    background:linear-gradient(90deg,#4ec5f1,#ffd23f)}

  /* ---------- Touch controls ---------- */
  #touch{display:none}
  body.touch #touch{display:block}
  #stick{position:absolute;left:4vmin;bottom:5vmin;width:34vmin;height:34vmin;max-width:200px;max-height:200px;
    border-radius:50%;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.2);pointer-events:auto}
  #stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
    background:rgba(255,255,255,.42)}
  .btn{position:absolute;width:20vmin;height:20vmin;max-width:120px;max-height:120px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);pointer-events:auto;
    display:grid;place-items:center;font-size:5vmin;color:#fff}
  .btn:active{background:rgba(255,255,255,.34)}
  #bJump{right:5vmin;bottom:6vmin}
  #bSpin{right:27vmin;bottom:13vmin}
  #bStomp{right:8vmin;bottom:27vmin;width:15vmin;height:15vmin;font-size:4vmin}
  #bPause{right:3vmin;top:3vmin;width:12vmin;height:12vmin;font-size:3.4vmin}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="grp"><span id="hearts"></span><span id="tank"><i></i></span></div>
  <div class="grp"><span id="stars">⭐ 0</span><span id="lives">🐱 5</span></div>
</div>
<div id="boss"></div>
<div id="toast"></div>

<div id="overlay">
  <a id="quit" href="https://orion.advicedawg.com/">◀ GAMES</a>
  <div class="card" id="card">
    <h1>SUPER ORION 2<small>COSMIC CANNONBALL</small></h1>
    <p class="lead">Loading the cosmos…</p>
    <div id="loadbar"><i></i></div>
  </div>
</div>

<div id="touch">
  <div id="stick"><i></i></div>
  <div class="btn" id="bJump">▲</div>
  <div class="btn" id="bSpin">✹</div>
  <div class="btn" id="bStomp">▼</div>
  <div class="btn" id="bPause">❚❚</div>
</div>

<script>
// The Steam Deck serves an offline mirror of both games off 127.0.0.1, where
// this game sits at /2/ under the menu instead of on its own domain.
if (location.hostname === '127.0.0.1') quit.href = '../';
</script>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
